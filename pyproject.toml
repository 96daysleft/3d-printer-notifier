[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-printer-notifier"
dynamic = ["version"]
description = "Discord notifications for 3D printers (Snapmaker U1, Elegoo Centauri Carbon, ...) over their WebSocket APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "96 Days left" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "aiohttp>=3.9.1",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "structlog>=23.2.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
3d-printer-notifier = "printer_notifier.__main__:main"

[tool.setuptools.packages.find]
include = ["printer_notifier*"]

[tool.setuptools_scm]
# Docker builds have no .git: pass SETUPTOOLS_SCM_PRETEND_VERSION instead
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
