apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "3d-printer-notifier.fullname" . }}
  labels:
    {{- include "3d-printer-notifier.labels" . | nindent 4 }}
spec:
  # One instance only: more would duplicate every notification
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "3d-printer-notifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "3d-printer-notifier.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if not .Values.existingSecret }}
        # Roll the pod when the rendered config changes
        checksum/config: {{ include "3d-printer-notifier.config" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notifier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: CONFIG_FILE
              value: /config/config.yaml
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.healthPort }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          secret:
            secretName: {{ include "3d-printer-notifier.secretName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
