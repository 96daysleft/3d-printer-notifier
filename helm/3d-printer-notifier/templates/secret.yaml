{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "3d-printer-notifier.fullname" . }}
  labels:
    {{- include "3d-printer-notifier.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "3d-printer-notifier.config" . | nindent 4 }}
{{- end }}
