# Argo CD Application deploying the chart from GHCR with inline values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 3d-printer-notifier
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/96daysleft/charts
    chart: 3d-printer-notifier
    targetRevision: 0.1.0
    helm:
      valuesObject:
        discord:
          webhookUrl: ${DISCORD_WEBHOOK_URL}
        extraEnvFrom:
          - secretRef:
              name: printer-notifier-secrets
        printers:
          - {name: U1, type: u1, host: 192.168.1.50}
          - {name: Centauri, type: cc1, host: 192.168.1.60}
  destination:
    server: https://kubernetes.default.svc
    namespace: 3d-printer-notifier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
